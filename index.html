<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE://DEFENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060a14;
    --panel: rgba(10,16,30,0.86);
    --panel-border: #1b2c46;
    --cyan: #00e5ff;
    --amber: #ff9500;
    --magenta: #d926ff;
    --danger: #ff3b5c;
    --text: #cfe6f2;
    --text-dim: #6f8aa8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Space Mono',monospace; color:var(--text);}
  #app{position:relative; width:100vw; height:100vh;}
  canvas{display:block; width:100%; height:100%; touch-action:none;}

  #mainMenu{
    position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 42%, rgba(0,229,255,0.12), transparent 35%), rgba(4,6,12,0.78);
    backdrop-filter:blur(8px);
  }
  #mainMenu.hidden{display:none;}
  #mainMenuBox{width:min(460px, calc(100vw - 32px)); padding:48px 42px; text-align:center;}
  #mainMenuTitle{font-family:'Orbitron',sans-serif; font-size:clamp(28px, 7vw, 48px); font-weight:900; letter-spacing:4px; color:var(--cyan); text-shadow:0 0 18px rgba(0,229,255,0.55);}
  #mainMenuSubtitle{margin:12px 0 32px; color:var(--text-dim); font-size:11px; letter-spacing:1px;}
  .menu-btn{
    display:block; width:100%; margin-top:10px; padding:14px 18px; font-family:'Orbitron',sans-serif; font-weight:700;
    letter-spacing:1.5px; font-size:12px; color:var(--cyan); background:rgba(0,229,255,0.08);
    border:1px solid var(--cyan); cursor:pointer; transition:all .15s ease;
  }
  .menu-btn:hover{background:rgba(0,229,255,0.22); box-shadow:0 0 18px rgba(0,229,255,0.3);}
  .menu-btn.secondary{color:var(--text-dim); border-color:var(--panel-border); background:rgba(10,16,30,0.5);}
  .menu-btn.secondary:hover{color:var(--text); border-color:var(--text-dim); box-shadow:none;}

  .selection-screen{position:absolute; inset:0; z-index:45; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 42%, rgba(0,229,255,0.12), transparent 35%), rgba(4,6,12,0.92); overflow:auto;}
  .selection-screen.hidden{display:none;}
  .selection-box{width:min(720px, calc(100vw - 32px)); padding:34px; background:var(--panel); border:1px solid var(--panel-border);}
  .selection-kicker{color:var(--amber); font-size:10px; letter-spacing:1.5px; margin-bottom:10px;}
  .selection-box h1{font-family:'Orbitron',sans-serif; color:var(--cyan); letter-spacing:3px; font-size:28px;}
  .selection-subtitle{color:var(--text-dim); font-size:11px; margin:10px 0 20px;}
  #classCards,#perkCards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;}
  .selection-card{display:flex; flex-direction:column; align-items:flex-start; gap:8px; min-height:150px; padding:16px; text-align:left; color:var(--text); background:rgba(0,229,255,0.04); border:1px solid var(--panel-border); cursor:pointer;}
  .selection-card:hover,.selection-card.selected{border-color:var(--cyan); background:rgba(0,229,255,0.13); box-shadow:0 0 14px rgba(0,229,255,0.2);}
  .selection-card strong{font-family:'Orbitron',sans-serif; letter-spacing:.7px; color:var(--cyan);}
  .selection-card span:not(.selection-card-label){font-size:10px; line-height:1.5; color:var(--text-dim);}
  .selection-card-label{font-size:9px; letter-spacing:1.4px; color:var(--amber);}
  .selection-card small{margin-top:auto; color:var(--amber); font-size:9px; letter-spacing:1px;}
  #classContinueBtn:disabled{opacity:.4; cursor:not-allowed;}
  #perkSelectionStatus{color:var(--text-dim); font-size:10px; letter-spacing:1px; margin-top:16px;}
  .loadout-panel{display:flex; flex-direction:column; min-width:145px; font-size:9px; line-height:1.5; color:var(--text-dim);}
  .loadout-panel strong{font-family:'Orbitron',sans-serif; color:var(--cyan); font-size:10px; letter-spacing:.5px;}

  .brackets{
    position:relative;
  }
  .brackets::before, .brackets::after{
    content:''; position:absolute; width:14px; height:14px; border-color:var(--cyan); opacity:0.7;
  }
  .brackets::before{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid;}
  .brackets::after{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid;}

  #hud{position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;}
  #towerSkillControls{position:absolute; inset:0; pointer-events:none; z-index:5;}
  .tower-skill-control{
    position:absolute; width:44px; height:44px; transform:translate(-50%,-50%); pointer-events:auto;
    padding:0; color:var(--text); background:rgba(10,16,30,.9); border:1px solid var(--panel-border);
    cursor:not-allowed; --cooldown-progress:1;
  }
  .tower-skill-control::before{
    content:''; position:absolute; inset:5px; border-radius:50%;
    background:conic-gradient(var(--cyan) calc(var(--cooldown-progress) * 100%), var(--panel-border) 0);
  }
  .tower-skill-control::after{content:''; position:absolute; inset:9px; border-radius:50%; background:rgba(10,16,30,.96);}
  .tower-skill-control.ready{border-color:var(--cyan); cursor:pointer;}
  .tower-skill-control:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  .tower-auto-cast-btn{width:100%; margin:10px 0; padding:7px 8px; font:700 10px 'Space Mono',monospace; color:var(--text-dim); background:rgba(10,16,30,.9); border:1px solid var(--panel-border); cursor:pointer;}
  .tower-auto-cast-btn.active{color:var(--amber); border-color:var(--amber);}

  .hud-top{
    pointer-events:auto;
    position:relative; z-index:30;
    display:flex; align-items:center; gap:18px;
    margin:14px 14px 0 14px;
    padding:10px 18px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(6px);
  }
  .brand{
    font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:2px; font-size:18px;
    color:var(--cyan); text-shadow:0 0 12px rgba(0,229,255,0.55);
    white-space:nowrap;
  }
  .brand span{color:var(--text-dim); font-weight:500;}
  .stats{display:flex; gap:22px; flex:1; justify-content:center; flex-wrap:wrap;}
  .stat{display:flex; align-items:baseline; gap:6px; font-size:13px; color:var(--text-dim);}
  .stat .glyph{font-size:15px;}
  .stat span{font-family:'Orbitron',sans-serif; font-weight:700; font-size:16px; color:var(--text);}
  .stat.gold .glyph{color:var(--amber);}
  .stat.gold span{color:var(--amber);}
  .stat.integrity .glyph{color:var(--danger);}
  .stat.integrity span{color:var(--danger);}
  .stat.wave .glyph{color:var(--cyan);}
  .stat.wave span{color:var(--cyan);}
  .stat label{font-size:10px; letter-spacing:1.5px; color:var(--text-dim);}

  #waveBtn{
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:1.5px; font-size:12px;
    background:linear-gradient(180deg, rgba(0,229,255,0.18), rgba(0,229,255,0.05));
    border:1px solid var(--cyan); color:var(--cyan);
    padding:10px 18px; cursor:pointer; white-space:nowrap;
    transition:all .15s ease; text-shadow:0 0 8px rgba(0,229,255,0.6);
  }
  #waveBtn:hover:not(:disabled){background:rgba(0,229,255,0.25); box-shadow:0 0 16px rgba(0,229,255,0.35);}
  #waveBtn:disabled{opacity:0.35; cursor:not-allowed; color:var(--text-dim); border-color:var(--panel-border); text-shadow:none;}

  #speedControls{position:relative; z-index:30; display:flex; gap:4px; align-items:center; white-space:nowrap;}
  #wallModeControls{position:relative; z-index:30; display:flex; gap:4px; align-items:center; white-space:nowrap;}
  .wall-mode-btn{
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:10px; letter-spacing:0.5px;
    padding:8px 9px; color:var(--text-dim); background:rgba(10,16,30,0.5);
    border:1px solid var(--panel-border); cursor:pointer; transition:all .15s ease;
  }
  .wall-mode-btn:hover{border-color:var(--amber); color:var(--text);}
  .wall-mode-btn.active{color:var(--amber); border-color:var(--amber); background:rgba(255,149,0,0.16); box-shadow:0 0 10px rgba(255,149,0,0.22);}
  .speed-btn{
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:10px; letter-spacing:0.5px;
    padding:8px 9px; color:var(--text-dim); background:rgba(10,16,30,0.5);
    border:1px solid var(--panel-border); cursor:pointer; transition:all .15s ease;
  }
  .speed-btn:hover{border-color:var(--cyan); color:var(--text);}
  .speed-btn.active{color:var(--cyan); border-color:var(--cyan); background:rgba(0,229,255,0.16); box-shadow:0 0 10px rgba(0,229,255,0.22);}

  .hud-bottom{
    pointer-events:auto;
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
    margin:0 14px 14px 14px;
  }

  #nodeCards{display:flex; align-items:flex-start; align-content:flex-start; gap:10px; flex-wrap:wrap; max-width:min(700px, 70vw);}
  .node-card{
    width:150px;
    flex:0 0 auto;
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter:blur(6px);
    padding:10px 12px; cursor:pointer; transition:all .15s ease;
  }
  .node-card:hover{border-color:var(--text-dim);}
  .node-card.active{border-color:var(--cyan); box-shadow:0 0 14px rgba(0,229,255,0.3); background:rgba(0,229,255,0.06);}
  .node-icon{width:22px; height:22px; margin-bottom:8px;}
  .node-name{font-family:'Orbitron',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.5px; margin-bottom:4px;}
  .node-desc{font-size:10px; color:var(--text-dim); margin-top:6px; line-height:1.4;}
  .node-card.tile-card{border-color:rgba(56,255,138,0.35);}
  .node-card.tile-card.active{border-color:#38ff8a; box-shadow:0 0 14px rgba(56,255,138,0.28); background:rgba(56,255,138,0.06);}

  #selectedPanel{
    width:210px;
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter:blur(6px);
    padding:12px 14px;
  }
  #selectedPanel.hidden{display:none;}
  #selectedPanel h3{font-family:'Orbitron',sans-serif; font-size:13px; letter-spacing:1px; margin-bottom:8px;}
  #selectedPanel .row{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:4px;}
  #selectedPanel .row b{color:var(--text); font-weight:400;}
  #selEnchantments{color:var(--amber) !important;}
  #tileTooltip{
    position:absolute; z-index:4; width:220px; padding:10px 12px;
    background:var(--panel); border:1px solid #38ff8a; box-shadow:0 0 14px rgba(56,255,138,0.22);
    backdrop-filter:blur(6px); pointer-events:none; transition:opacity .12s ease;
  }
  #tileTooltip.hidden{display:none;}
  #tileTooltip h3{font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:.7px; margin-bottom:5px; color:#38ff8a;}
  #tileTooltip p{font-size:10px; color:var(--text-dim); line-height:1.4;}
  .upgrade-actions{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
  .upgrade-btn{
    display:flex; justify-content:space-between; align-items:center; width:100%; padding:6px 8px;
    font-family:'Space Mono',monospace; font-size:10px; color:var(--cyan);
    background:rgba(0,229,255,0.06); border:1px solid var(--panel-border); cursor:pointer;
  }
  .upgrade-btn b{color:var(--amber); font-weight:400;}
  .upgrade-btn:hover:not(:disabled){border-color:var(--cyan); background:rgba(0,229,255,0.15);}
  .upgrade-btn:disabled{opacity:0.35; cursor:not-allowed;}
  #purgeBtn{
    margin-top:8px; width:100%; padding:8px; font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:1px;
    background:rgba(255,59,92,0.08); border:1px solid var(--danger); color:var(--danger); cursor:pointer;
  }
  #purgeBtn:hover{background:rgba(255,59,92,0.2);}

  #message{
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    font-family:'Orbitron',sans-serif; font-size:12px; letter-spacing:1.5px;
    background:rgba(255,59,92,0.12); border:1px solid var(--danger); color:var(--danger);
    padding:8px 16px; pointer-events:none; opacity:0; transition:opacity .2s ease;
  }
  #message.show{opacity:1;}

  #hint{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--text-dim); letter-spacing:0.5px; opacity:0.8; pointer-events:none;
    text-align:center;
  }

  #overlay{
    position:absolute; inset:0; background:rgba(4,6,12,0.86); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:20;
  }
  #overlay.hidden{display:none;}
  #overlayBox{
    text-align:center; padding:40px 60px; border:1px solid var(--panel-border); background:var(--panel);
  }
  #overlayTitle{font-family:'Orbitron',sans-serif; font-size:32px; font-weight:900; letter-spacing:3px; margin-bottom:12px;}
  #overlaySubtitle{font-size:12px; color:var(--text-dim); margin-bottom:22px; max-width:340px;}
  #restartBtn{
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:1.5px; font-size:12px;
    background:rgba(0,229,255,0.1); border:1px solid var(--cyan); color:var(--cyan);
    padding:12px 26px; cursor:pointer;
  }
  #restartBtn:hover{background:rgba(0,229,255,0.25); box-shadow:0 0 16px rgba(0,229,255,0.35);}

  #rewardOverlay{
    position:absolute; inset:0; background:rgba(4,6,12,0.86); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:15;
  }
  #mobileHint{display:none;}
  #rewardOverlay.hidden{display:none;}
  #rewardBox{width:min(720px, calc(100vw - 32px)); padding:30px; border:1px solid var(--panel-border); background:var(--panel);}
  #rewardTitle{font-family:'Orbitron',sans-serif; color:var(--cyan); font-size:24px; letter-spacing:2px; text-align:center;}
  #rewardSubtitle{font-size:11px; color:var(--text-dim); margin:10px 0 22px; text-align:center;}
  #rewardCards{display:flex; gap:12px; justify-content:center;}
  .reward-card{
    flex:1; min-height:190px; padding:16px 12px; color:var(--text); background:rgba(0,229,255,0.05);
    border:1px solid var(--panel-border); cursor:pointer; text-align:left; transition:all .15s ease;
  }
  .reward-card:hover{border-color:var(--cyan); background:rgba(0,229,255,0.13); box-shadow:0 0 16px rgba(0,229,255,0.25);}
  .reward-card .node-icon{margin:0 auto 14px;}
  .reward-card .node-name{font-size:12px; text-align:center;}
  .reward-card .node-desc{min-height:42px;}
  .reward-stats{display:flex; justify-content:space-between; margin-top:10px; color:var(--amber); font-size:10px;}

  @media (max-width:520px){
    .selection-box{padding:24px 18px;}
    .selection-box h1{font-size:22px;}
    #rewardBox{padding:22px 14px;}
    #rewardCards{gap:6px;}
    .reward-card{padding:12px 8px; min-height:175px;}
    .reward-card .node-desc{display:none;}
  }

  .hidden{display:none !important;}

  @media (max-width:720px){
    .hud-top{flex-wrap:wrap; gap:10px;}
    .stats{gap:12px; order:3; width:100%; justify-content:space-around;}
    .brand{font-size:14px;}
    .node-card{width:110px;}
    .node-desc{display:none;}
    #desktopHint{display:none;}
    #mobileHint{display:inline;}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas" class="hidden"></canvas>
  <div id="mainMenu" aria-labelledby="mainMenuTitle">
    <div id="mainMenuBox" class="brackets">
      <div id="mainMenuTitle">CORE://DEFENSE</div>
      <div id="mainMenuSubtitle">SECURE THE SECTOR. HOLD THE LINE.</div>
      <button id="startGameBtn" class="menu-btn" type="button">START GAME</button>
      <button id="settingsBtn" class="menu-btn secondary" type="button">SETTINGS</button>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
<!-- Game logic lives in src/main.js and its domain modules. -->
</body>
</html>
