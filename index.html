<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE://DEFENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060a14;
    --panel: rgba(10,16,30,0.86);
    --panel-border: #1b2c46;
    --cyan: #00e5ff;
    --amber: #ff9500;
    --magenta: #d926ff;
    --danger: #ff3b5c;
    --text: #cfe6f2;
    --text-dim: #6f8aa8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Space Mono',monospace; color:var(--text);}
  #app{position:relative; width:100vw; height:100vh;}
  canvas{display:block; width:100%; height:100%;}

  .brackets{
    position:relative;
  }
  .brackets::before, .brackets::after{
    content:''; position:absolute; width:14px; height:14px; border-color:var(--cyan); opacity:0.7;
  }
  .brackets::before{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid;}
  .brackets::after{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid;}

  #hud{position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;}

  .hud-top{
    pointer-events:auto;
    display:flex; align-items:center; gap:18px;
    margin:14px 14px 0 14px;
    padding:10px 18px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(6px);
  }
  .brand{
    font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:2px; font-size:18px;
    color:var(--cyan); text-shadow:0 0 12px rgba(0,229,255,0.55);
    white-space:nowrap;
  }
  .brand span{color:var(--text-dim); font-weight:500;}
  .stats{display:flex; gap:22px; flex:1; justify-content:center; flex-wrap:wrap;}
  .stat{display:flex; align-items:baseline; gap:6px; font-size:13px; color:var(--text-dim);}
  .stat .glyph{font-size:15px;}
  .stat span{font-family:'Orbitron',sans-serif; font-weight:700; font-size:16px; color:var(--text);}
  .stat.gold .glyph{color:var(--amber);}
  .stat.gold span{color:var(--amber);}
  .stat.integrity .glyph{color:var(--danger);}
  .stat.integrity span{color:var(--danger);}
  .stat.wave .glyph{color:var(--cyan);}
  .stat.wave span{color:var(--cyan);}
  .stat label{font-size:10px; letter-spacing:1.5px; color:var(--text-dim);}

  #waveBtn{
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:1.5px; font-size:12px;
    background:linear-gradient(180deg, rgba(0,229,255,0.18), rgba(0,229,255,0.05));
    border:1px solid var(--cyan); color:var(--cyan);
    padding:10px 18px; cursor:pointer; white-space:nowrap;
    transition:all .15s ease; text-shadow:0 0 8px rgba(0,229,255,0.6);
  }
  #waveBtn:hover:not(:disabled){background:rgba(0,229,255,0.25); box-shadow:0 0 16px rgba(0,229,255,0.35);}
  #waveBtn:disabled{opacity:0.35; cursor:not-allowed; color:var(--text-dim); border-color:var(--panel-border); text-shadow:none;}

  .hud-bottom{
    pointer-events:auto;
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
    margin:0 14px 14px 14px;
  }

  #nodeCards{display:flex; align-items:flex-start; align-content:flex-start; gap:10px; flex-wrap:wrap; max-width:min(700px, 70vw);}
  .node-card{
    width:150px;
    flex:0 0 auto;
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter:blur(6px);
    padding:10px 12px; cursor:pointer; transition:all .15s ease;
  }
  .node-card:hover{border-color:var(--text-dim);}
  .node-card.active{border-color:var(--cyan); box-shadow:0 0 14px rgba(0,229,255,0.3); background:rgba(0,229,255,0.06);}
  .node-icon{width:22px; height:22px; margin-bottom:8px;}
  .node-name{font-family:'Orbitron',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.5px; margin-bottom:4px;}
  .node-desc{font-size:10px; color:var(--text-dim); margin-top:6px; line-height:1.4;}
  .node-card.tile-card{border-color:rgba(56,255,138,0.35);}
  .node-card.tile-card.active{border-color:#38ff8a; box-shadow:0 0 14px rgba(56,255,138,0.28); background:rgba(56,255,138,0.06);}

  #selectedPanel{
    width:210px;
    background:var(--panel); border:1px solid var(--panel-border);
    backdrop-filter:blur(6px);
    padding:12px 14px;
  }
  #selectedPanel.hidden{display:none;}
  #selectedPanel h3{font-family:'Orbitron',sans-serif; font-size:13px; letter-spacing:1px; margin-bottom:8px;}
  #selectedPanel .row{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:4px;}
  #selectedPanel .row b{color:var(--text); font-weight:400;}
  .upgrade-actions{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
  .upgrade-btn{
    display:flex; justify-content:space-between; align-items:center; width:100%; padding:6px 8px;
    font-family:'Space Mono',monospace; font-size:10px; color:var(--cyan);
    background:rgba(0,229,255,0.06); border:1px solid var(--panel-border); cursor:pointer;
  }
  .upgrade-btn b{color:var(--amber); font-weight:400;}
  .upgrade-btn:hover:not(:disabled){border-color:var(--cyan); background:rgba(0,229,255,0.15);}
  .upgrade-btn:disabled{opacity:0.35; cursor:not-allowed;}
  #purgeBtn{
    margin-top:8px; width:100%; padding:8px; font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:1px;
    background:rgba(255,59,92,0.08); border:1px solid var(--danger); color:var(--danger); cursor:pointer;
  }
  #purgeBtn:hover{background:rgba(255,59,92,0.2);}

  #message{
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    font-family:'Orbitron',sans-serif; font-size:12px; letter-spacing:1.5px;
    background:rgba(255,59,92,0.12); border:1px solid var(--danger); color:var(--danger);
    padding:8px 16px; pointer-events:none; opacity:0; transition:opacity .2s ease;
  }
  #message.show{opacity:1;}

  #hint{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--text-dim); letter-spacing:0.5px; opacity:0.8; pointer-events:none;
    text-align:center;
  }

  #overlay{
    position:absolute; inset:0; background:rgba(4,6,12,0.86); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:20;
  }
  #overlay.hidden{display:none;}
  #overlayBox{
    text-align:center; padding:40px 60px; border:1px solid var(--panel-border); background:var(--panel);
  }
  #overlayTitle{font-family:'Orbitron',sans-serif; font-size:32px; font-weight:900; letter-spacing:3px; margin-bottom:12px;}
  #overlaySubtitle{font-size:12px; color:var(--text-dim); margin-bottom:22px; max-width:340px;}
  #restartBtn{
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:1.5px; font-size:12px;
    background:rgba(0,229,255,0.1); border:1px solid var(--cyan); color:var(--cyan);
    padding:12px 26px; cursor:pointer;
  }
  #restartBtn:hover{background:rgba(0,229,255,0.25); box-shadow:0 0 16px rgba(0,229,255,0.35);}

  #rewardOverlay{
    position:absolute; inset:0; background:rgba(4,6,12,0.86); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:15;
  }
  #rewardOverlay.hidden{display:none;}
  #rewardBox{width:min(720px, calc(100vw - 32px)); padding:30px; border:1px solid var(--panel-border); background:var(--panel);}
  #rewardTitle{font-family:'Orbitron',sans-serif; color:var(--cyan); font-size:24px; letter-spacing:2px; text-align:center;}
  #rewardSubtitle{font-size:11px; color:var(--text-dim); margin:10px 0 22px; text-align:center;}
  #rewardCards{display:flex; gap:12px; justify-content:center;}
  .reward-card{
    flex:1; min-height:190px; padding:16px 12px; color:var(--text); background:rgba(0,229,255,0.05);
    border:1px solid var(--panel-border); cursor:pointer; text-align:left; transition:all .15s ease;
  }
  .reward-card:hover{border-color:var(--cyan); background:rgba(0,229,255,0.13); box-shadow:0 0 16px rgba(0,229,255,0.25);}
  .reward-card .node-icon{margin:0 auto 14px;}
  .reward-card .node-name{font-size:12px; text-align:center;}
  .reward-card .node-desc{min-height:42px;}
  .reward-stats{display:flex; justify-content:space-between; margin-top:10px; color:var(--amber); font-size:10px;}

  @media (max-width:520px){
    #rewardBox{padding:22px 14px;}
    #rewardCards{gap:6px;}
    .reward-card{padding:12px 8px; min-height:175px;}
    .reward-card .node-desc{display:none;}
  }

  .hidden{display:none !important;}

  @media (max-width:720px){
    .hud-top{flex-wrap:wrap; gap:10px;}
    .stats{gap:12px; order:3; width:100%; justify-content:space-around;}
    .brand{font-size:14px;}
    .node-card{width:110px;}
    .node-desc{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-top brackets">
      <div class="brand">CORE<span>://</span>DEFENSE</div>
      <div class="stats">
        <div class="stat gold"><span class="glyph">⬡</span><span id="goldVal">150</span><label>GOLD</label></div>
        <div class="stat integrity"><span class="glyph">◈</span><span id="livesVal">20</span><label>INTEGRITY</label></div>
        <div class="stat wave"><span class="glyph">▣</span><span id="waveVal">0</span>/<span id="waveMax">10</span><label>WAVE</label></div>
      </div>
      <button id="waveBtn">INITIATE WAVE</button>
    </div>

    <div id="message"></div>

    <div class="hud-bottom">
      <div id="nodeCards" class="brackets"></div>
      <div id="selectedPanel" class="hidden brackets">
        <h3 id="selName">NODE</h3>
        <div class="row"><span>DAMAGE</span><b id="selDmg">-</b></div>
        <div class="row"><span>RANGE</span><b id="selRange">-</b></div>
        <div class="row"><span>RATE</span><b id="selRate">-</b></div>
        <div class="row"><span>KILLS</span><b id="selKills">-</b></div>
        <div class="upgrade-actions" aria-label="Tower upgrades">
          <button id="upgradeDamageBtn" class="upgrade-btn" data-stat="damage"><span>DAMAGE +20%</span><b id="damageUpgradeCost">⬡ 40</b></button>
          <button id="upgradeRangeBtn" class="upgrade-btn" data-stat="range"><span>RANGE +10%</span><b id="rangeUpgradeCost">⬡ 35</b></button>
          <button id="upgradeFireRateBtn" class="upgrade-btn" data-stat="fireRate"><span>RATE +15%</span><b id="fireRateUpgradeCost">⬡ 45</b></button>
        </div>
        <button id="purgeBtn">PURGE NODE</button>
      </div>
    </div>
    <div id="hint">LEFT-DRAG: place walls · RIGHT-DRAG: remove walls · CLICK: select node or tile &nbsp;·&nbsp; SCROLL: zoom</div>
  </div>

  <div id="rewardOverlay" class="hidden" aria-labelledby="rewardTitle">
    <div id="rewardBox" class="brackets">
      <div id="rewardTitle">WAVE REWARD</div>
      <div id="rewardSubtitle">SELECT ONE NODE OR TILE TO ADD TO YOUR INVENTORY</div>
      <div id="rewardCards"></div>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div id="overlayBox" class="brackets">
      <div id="overlayTitle"></div>
      <div id="overlaySubtitle"></div>
      <button id="restartBtn">REINITIALIZE</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { CELL, ENEMY_TYPES, GRID_H, GRID_W, MAX_WAVE, TOWER_TYPES } from './src/game/config.js';
import { canPlaceTower, canPlaceWall, canRemoveWall, canStartWave, cellKey, enemyHealth, findPath, generateWave } from './src/game/rules.js';
import { addRewardToInventory, createRewardPool, drawRewards, removeFromInventory, removeInventoryItem } from './src/game/rewards.js';
import { INITIAL_TILES, SPECIAL_TILE_TYPES, applyDotTick, canPlaceTile, getEffectiveTowerStats, getEnemyTileEffect, getTileAt } from './src/game/specialTiles.js';
import { getTowerStats, getUpgradeCost, purchaseTowerUpgrade, UPGRADE_STATS } from './src/game/upgrades.js';

(function(){
  "use strict";

  /* ---------------------------------------------------------------------
     CONFIG
  --------------------------------------------------------------------- */
  /* ---------------------------------------------------------------------
     STATE
  --------------------------------------------------------------------- */
  let gold = 150, lives = 20, wave = 0, waveInProgress = false, gameOver = false, awaitingReward = false;
  let selectedTowerType = null, selectedTileType = null;
  let selectedTower = null;
  let spawnQueue = [], spawnTimer = 0;
  let towers = [], enemies = [], projectiles = [], effects = [], pulses = [];
  const rewardPool = createRewardPool(TOWER_TYPES, SPECIAL_TILE_TYPES);
  let inventory = rewardPool.filter((reward) => reward.type === 'tower').map((reward) => ({...reward}));
  let tiles = INITIAL_TILES.map((tile) => ({...tile}));
  let currentRewards = [];
  let occupiedSet = new Set(), wallSet = new Set(), pathSet = new Set(), pathSetRoute = [];
  let routeVersion = 0;
  const startCell = {gx: 0, gy: 1};
  const endCell = {gx: GRID_W - 1, gy: 6};
  const WALL_TOP = 0.78;
  let worldWaypoints = [], segLengths = [], pathTotalLength = 0;

  /* ---------------------------------------------------------------------
     THREE.JS SETUP
  --------------------------------------------------------------------- */
  const canvas = document.getElementById('gameCanvas');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060a14);
  // Keep the board readable at the default orbit distance. The board is
  // intentionally wide, so a dense fog makes its far edge disappear.
  scene.fog = new THREE.FogExp2(0x060a14, 0.012);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
  } catch(error) {
    canvas.dataset.renderStatus = 'error';
    canvas.setAttribute('aria-label', '3D renderer unavailable');
    console.error('CORE://DEFENSE could not initialize WebGL.', error);
    throw error;
  }
  canvas.dataset.renderStatus = 'ready';
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // camera orbit
  let camAzimuth = 0.55, camElevation = 0.95, camDistance = 36;
  const camTarget = new THREE.Vector3(0,0,0);
  function updateCamera(){
    camera.position.set(
      camTarget.x + camDistance*Math.sin(camAzimuth)*Math.cos(camElevation),
      camTarget.y + camDistance*Math.sin(camElevation),
      camTarget.z + camDistance*Math.cos(camAzimuth)*Math.cos(camElevation)
    );
    camera.lookAt(camTarget);
  }
  updateCamera();

  // lights
  scene.add(new THREE.AmbientLight(0x223355, 0.75));
  const sun = new THREE.DirectionalLight(0xaeefff, 1.0);
  sun.position.set(14, 26, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
  sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
  scene.add(sun);

  // faint grid helper for atmosphere
  const gridHelper = new THREE.GridHelper(Math.max(GRID_W,GRID_H)*CELL+10, 30, 0x11304a, 0x0c1c30);
  gridHelper.position.y = -0.35;
  scene.add(gridHelper);

  /* ---------------------------------------------------------------------
     GRID / PATH HELPERS
  --------------------------------------------------------------------- */
  function gridToWorld(gx, gy){
    return new THREE.Vector3((gx-(GRID_W-1)/2)*CELL, 0, (gy-(GRID_H-1)/2)*CELL);
  }

  function buildPathMath(){
    worldWaypoints = [gridToWorld(-1, startCell.gy), ...pathSetRoute.map(cell => gridToWorld(cell.gx, cell.gy)), gridToWorld(GRID_W, endCell.gy)];
    segLengths = [];
    pathTotalLength = 0;
    for(let i=0;i<worldWaypoints.length-1;i++){
      const d = worldWaypoints[i].distanceTo(worldWaypoints[i+1]);
      segLengths.push(d);
      pathTotalLength += d;
    }
  }

  function getPointOnPath(dist){
    dist = Math.max(0, Math.min(dist, pathTotalLength));
    let acc = 0;
    for(let i=0;i<segLengths.length;i++){
      if(dist <= acc+segLengths[i] || i === segLengths.length-1){
        const t = segLengths[i] > 0 ? Math.min(Math.max((dist-acc)/segLengths[i],0),1) : 0;
        return new THREE.Vector3().lerpVectors(worldWaypoints[i], worldWaypoints[i+1], t);
      }
      acc += segLengths[i];
    }
    return worldWaypoints[worldWaypoints.length-1].clone();
  }

  function markPathCells(){
    pathSetRoute = findPath({gridW: GRID_W, gridH: GRID_H, start: startCell, end: endCell, blocked: wallSet}) || [];
    pathSet = new Set(pathSetRoute.map(({gx, gy}) => cellKey(gx, gy)));
  }

  function getPointOnRoute(route, lengths, totalLength, dist){
    dist = Math.max(0, Math.min(dist, totalLength));
    let acc = 0;
    for(let i = 0; i < lengths.length; i += 1){
      if(dist <= acc + lengths[i] || i === lengths.length - 1){
        const ratio = lengths[i] > 0 ? Math.min(Math.max((dist - acc) / lengths[i], 0), 1) : 0;
        return new THREE.Vector3().lerpVectors(route[i], route[i + 1], ratio);
      }
      acc += lengths[i];
    }
    return route[route.length - 1].clone();
  }

  function getRouteMetrics(route){
    const lengths = [];
    let total = 0;
    for(let index = 0; index < route.length - 1; index += 1){
      const length = route[index].distanceTo(route[index + 1]);
      lengths.push(length);
      total += length;
    }
    return {lengths, total};
  }

  function getGridCellFromWorld(position){
    return {
      gx: Math.min(GRID_W - 1, Math.max(0, Math.round(position.x / CELL + (GRID_W - 1) / 2))),
      gy: Math.min(GRID_H - 1, Math.max(0, Math.round(position.z / CELL + (GRID_H - 1) / 2)))
    };
  }

  function rebuildEnemyRoute(enemy){
    const currentPosition = new THREE.Vector3(enemy.mesh.position.x, 0, enemy.mesh.position.z);
    const currentCell = getGridCellFromWorld(currentPosition);
    const remainingCells = findPath({
      gridW: GRID_W,
      gridH: GRID_H,
      start: currentCell,
      end: endCell,
      blocked: wallSet
    });
    if(!remainingCells) return;
    const futurePoints = remainingCells
      .slice(1)
      .map(cell => gridToWorld(cell.gx, cell.gy));
    futurePoints.push(gridToWorld(GRID_W, endCell.gy));
    const route = [currentPosition, ...futurePoints];
    const metrics = getRouteMetrics(route);
    enemy.route = route;
    enemy.routeLengths = metrics.lengths;
    enemy.routeTotalLength = metrics.total;
    enemy.traveled = 0;
    enemy.routeVersion = routeVersion;
  }

  markPathCells();
  buildPathMath();

  /* ---------------------------------------------------------------------
     GROUND CELLS
  --------------------------------------------------------------------- */
  const groundGroup = new THREE.Group();
  scene.add(groundGroup);
  const wallGroup = new THREE.Group();
  scene.add(wallGroup);
  const tileGroup = new THREE.Group();
  scene.add(tileGroup);
  const cellMeshList = [];
  const cellMeshMap = {};
  const wallMeshMap = {};
  const tileMeshMap = {};

  const buildableMat = new THREE.MeshStandardMaterial({color:0x172743, emissive:0x07101e, emissiveIntensity:0.7, roughness:0.85, metalness:0.1});
  const buildableHoverOkMat = new THREE.MeshStandardMaterial({color:0x123322, emissive:0x0d5c2f, emissiveIntensity:0.6, roughness:0.7});
  const buildableHoverBadMat = new THREE.MeshStandardMaterial({color:0x331515, emissive:0x7a1020, emissiveIntensity:0.6, roughness:0.7});
  const pathMat = new THREE.MeshStandardMaterial({color:0x0d3042, emissive:0x005d74, emissiveIntensity:0.9, roughness:0.6});
  const occupiedMat = new THREE.MeshStandardMaterial({color:0x161f30, roughness:0.9});
  const wallMat = new THREE.MeshStandardMaterial({color:0xff9500, emissive:0x7a3c00, emissiveIntensity:0.8, roughness:0.55, metalness:0.5});

  const cellGeo = new THREE.BoxGeometry(CELL*0.9, 0.2, CELL*0.9);

  for(let gx=0; gx<GRID_W; gx++){
    for(let gy=0; gy<GRID_H; gy++){
      const key = gx+','+gy;
      const isPath = pathSet.has(key);
      const mesh = new THREE.Mesh(cellGeo, isPath ? pathMat.clone() : buildableMat.clone());
      const p = gridToWorld(gx,gy);
      mesh.position.set(p.x, 0.1, p.z);
      mesh.receiveShadow = true;
      mesh.userData = {gx, gy, isPath};
      groundGroup.add(mesh);
      cellMeshList.push(mesh);
      cellMeshMap[key] = mesh;
    }
  }

  function setCellVisual(gx,gy){
    const key = gx+','+gy;
    const mesh = cellMeshMap[key];
    if(!mesh) return;
    if(wallSet.has(key)){ mesh.material = occupiedMat; return; }
    if(pathSet.has(key)){ mesh.material = pathMat; return; }
    if(occupiedSet.has(key)){ mesh.material = occupiedMat; return; }
    mesh.material = buildableMat;
  }

  function refreshRoute(){
    markPathCells();
    buildPathMath();
    routeVersion += 1;
    enemies.forEach(enemy => {
      if(!enemy.alive) return;
      rebuildEnemyRoute(enemy);
    });
    cellMeshList.forEach(mesh => setCellVisual(mesh.userData.gx, mesh.userData.gy));
  }

  function placeWall(gx, gy){
    const key = cellKey(gx, gy);
    wallSet.add(key);
    const p = gridToWorld(gx, gy);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(CELL * 0.72, 0.65, CELL * 0.72), wallMat.clone());
    mesh.position.set(p.x, 0.42, p.z);
    mesh.castShadow = true;
    mesh.userData = {gx, gy};
    wallGroup.add(mesh);
    wallMeshMap[key] = mesh;
    if(getTileAt(tiles, gx, gy)) renderTile(getTileAt(tiles, gx, gy));
    refreshRoute();
  }

  function removeWall(gx, gy){
    const key = cellKey(gx, gy);

  function buildTileMesh(tile){
    const cfg = SPECIAL_TILE_TYPES[tile.key];
    const group = new THREE.Group();
    const material = new THREE.MeshStandardMaterial({color: cfg.color, emissive: cfg.color, emissiveIntensity: 1.2, transparent: true, opacity: 0.82, roughness: 0.45, metalness: 0.25});
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, 0.08, 6), material);

    const marker = new THREE.Mesh(new THREE.RingGeometry(0.36, 0.43, 6), material.clone());

    marker.position.y = 0.34;

  function buildTowerMesh(cfg){

  function spawnEnemy(typeKey, waveNum){
    const type = ENEMY_TYPES[typeKey];

    const mesh = new THREE.Mesh(
      enemyGeometry(type),

    scene.add(barGroup);

    const enemy = {
      typeKey, type, mesh, barGroup, fg,

  function fireProjectile(tower){
    const cfg = tower.cfg;
    const mat = new THREE.MeshStandardMaterial({color:cfg.color, emissive:cfg.color, emissiveIntensity:2.0});
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), mat);

  function spawnEffect(pos, color){
    const geo = new THREE.RingGeometry(0.05, 0.16, 20);
    const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.9, side:THREE.DoubleSide});
    const mesh = new THREE.Mesh(geo, mat);

  function damageEnemy(enemy, dmg, sourceTower){
    if(!enemy.alive) return;
    enemy.hp -= dmg;
    if(enemy.hp <= 0 && enemy.alive){
      enemy.alive = false;
      gold += enemy.goldValue;
      updateGoldUI();
      if(sourceTower) sourceTower.kills++;
      spawnEffect(enemy.mesh.position, 0xffffff);
    }
  }

  /* ---------------------------------------------------------------------

  function startWave(){
    if(awaitingReward || !canStartWave({wave, waveInProgress, gameOver})) return;
    wave++;
    waveInProgress = true;
    spawnQueue = generateWave(wave);
    spawnTimer = 0;
    updateWaveUI();
    refreshWaveButton();
  }

  function updateSpawning(dt){
    if(spawnQueue.length === 0) return;
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnEnemy(spawnQueue.shift(), wave);
      spawnTimer = Math.max(0.32, 0.75 - wave*0.02);
    }
  }

  function checkWaveComplete(){
    if(waveInProgress && !gameOver && spawnQueue.length===0 && enemies.length===0){
      waveInProgress = false;
      presentWaveReward();
    }
  }

  /* ---------------------------------------------------------------------
     UPDATE LOOP FUNCTIONS
  --------------------------------------------------------------------- */
  function updateEnemies(dt, t){
    for(const enemy of enemies){
      if(!enemy.alive) continue;
      const cell = getGridCellFromWorld(enemy.mesh.position);
      const tile = getTileAt(tiles, cell.gx, cell.gy);
      const tileEffect = getEnemyTileEffect(tile);
      enemy.activeTile = tile?.key || null;
      enemy.activeTileEffect = tileEffect;
      enemy.traveled += enemy.speed * tileEffect.speedMultiplier * dt;
      const dotTick = applyDotTick({timer: enemy.dotTimer, dt, damage: tileEffect.dotDamage, interval: tileEffect.dotInterval});
      enemy.dotTimer = tileEffect.dotDamage ? dotTick.timer : 0;
      if(dotTick.damage) damageEnemy(enemy, dotTick.damage, null);
      if(enemy.traveled >= enemy.routeTotalLength){
        lives -= enemy.lifeDamage;
        updateLivesUI();
        enemy.alive = false;
        enemy.reachedEnd = true;
        if(lives <= 0){ triggerLoss(); }
        continue;
      }
      const p = getPointOnRoute(enemy.route, enemy.routeLengths, enemy.routeTotalLength, enemy.traveled);
      const bob = Math.sin(t*4 + enemy.phase)*0.08;
      enemy.mesh.position.set(p.x, 0.5+bob, p.z);
      enemy.mesh.rotation.y += dt*1.6;
      enemy.mesh.rotation.x += dt*0.8;
      enemy.barGroup.position.set(p.x, 1.05+bob, p.z);
      enemy.barGroup.quaternion.copy(camera.quaternion);
      enemy.fg.scale.x = Math.max(0.001, enemy.hp/enemy.maxHp);
      enemy.fg.position.x = -(0.7 - 0.7*enemy.fg.scale.x)/2;
    }
    const dead = enemies.filter(e=>!e.alive);
    dead.forEach(removeEnemy);
    if(dead.length) checkWaveComplete();
  }

  function distXZ(a,b){
    const dx=a.x-b.x, dz=a.z-b.z;
    return Math.sqrt(dx*dx+dz*dz);
  }

  function updateTowers(dt){
    for(const tower of towers){
      refreshTowerStats(tower);
      tower.cooldown -= dt;
      if(!tower.target || !tower.target.alive || distXZ(tower.group.position, tower.target.mesh.position) > tower.range){
        tower.target = null;
        let best=null, bestDist=Infinity;
        for(const e of enemies){
          if(!e.alive) continue;
          const d = distXZ(tower.group.position, e.mesh.position);
          if(d <= tower.range && d < bestDist){ best=e; bestDist=d; }
        }
        tower.target = best;
      }
      if(tower.target){
        const dx = tower.target.mesh.position.x - tower.group.position.x;
        const dz = tower.target.mesh.position.z - tower.group.position.z;
        tower.group.userData.turret.rotation.y = Math.atan2(dx,dz);
        if(tower.cooldown <= 0){
          fireProjectile(tower);
          tower.cooldown = 1/tower.fireRate;
        }
      }
      if(selectedTower === tower){
        tower.group.userData.turret.position.y = 0.42;
      }
    }
  }

  function updateProjectiles(dt){
    const remaining = [];
    for(const proj of projectiles){
      if(!proj.target || !proj.target.alive){
        projGroup.remove(proj.mesh);
        continue;
      }
      const targetPos = proj.target.mesh.position;
      const dir = new THREE.Vector3().subVectors(targetPos, proj.mesh.position);
      const dist = dir.length();
      if(dist < 0.35){
        damageEnemy(proj.target, proj.damage, proj.sourceTower);
        if(proj.splash > 0){
          for(const e of enemies){
            if(e === proj.target || !e.alive) continue;
            if(distXZ(e.mesh.position, targetPos) <= proj.splash){
              damageEnemy(e, proj.damage*0.6, proj.sourceTower);
            }
          }
        }
        spawnEffect(targetPos, proj.mesh.material.color.getHex());
        projGroup.remove(proj.mesh);
        continue;
      }
      dir.normalize();
      proj.mesh.position.addScaledVector(dir, proj.speed*dt);
      remaining.push(proj);
    }
    projectiles = remaining;
  }

  function updateEffects(dt){
    const remaining = [];
    for(const fx of effects){
      fx.life -= dt;
      if(fx.life <= 0){ scene.remove(fx.mesh); continue; }
      const s = 1 + (1-fx.life/fx.maxLife)*3;
      fx.mesh.scale.set(s,s,s);
      fx.mesh.material.opacity = fx.life/fx.maxLife;
      remaining.push(fx);
    }
    effects = remaining;
  }

  function iconShape(shape,color){
    const hex = '#' + color.toString(16).padStart(6,'0');
    if(shape==='diamond') return `<div style="width:100%;height:100%;background:${hex};transform:rotate(45deg) scale(0.7);box-shadow:0 0 8px ${hex};"></div>`;
    if(shape==='circle') return `<div style="width:100%;height:100%;border-radius:50%;background:${hex};box-shadow:0 0 8px ${hex};"></div>`;
    if(shape==='hex') return `<div style="width:100%;height:100%;background:${hex};clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);filter:drop-shadow(0 0 6px ${hex});"></div>`;
    if(shape==='cross') return `<div style="width:100%;height:100%;position:relative;filter:drop-shadow(0 0 6px ${hex});"><i style="position:absolute;left:42%;top:0;width:16%;height:100%;background:${hex};"></i><i style="position:absolute;left:0;top:42%;width:100%;height:16%;background:${hex};"></i></div>`;
    if(shape==='star') return `<div style="width:100%;height:100%;background:${hex};clip-path:polygon(50% 0,61% 36%,100% 36%,69% 58%,81% 100%,50% 74%,19% 100%,31% 58%,0 36%,39% 36%);filter:drop-shadow(0 0 6px ${hex});"></div>`;
    return `<div style="width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:19px solid ${hex};filter:drop-shadow(0 0 6px ${hex});"></div>`;
  }

  function buildNodeCards(){
    nodeCardsEl.innerHTML = '';
    inventory.forEach((item)=>{
      const cfg = item.type === 'tile' ? SPECIAL_TILE_TYPES[item.key] : TOWER_TYPES[item.key];
      if(!cfg) return;
      const card = document.createElement('div');
      card.className = `node-card${item.type === 'tile' ? ' tile-card' : ''}`;
      card.dataset.key = cfg.key;
      card.dataset.type = item.type;
      card.setAttribute('aria-label', `${cfg.name}, inventory item`);
      card.classList.toggle('active', item.type === 'tile' ? selectedTileType === cfg.key : selectedTowerType === cfg.key);
      card.innerHTML = `
        <div class="node-icon">${iconShape(cfg.shape, cfg.color)}</div>
        <div class="node-name">${cfg.name}</div>
        <div class="node-desc">${cfg.desc}</div>
      `;
      card.addEventListener('click', ()=>{
        if(gameOver || !inventory.some((inventoryItem) => inventoryItem.type === item.type && inventoryItem.key === cfg.key)) return;
        const isTile = item.type === 'tile';
        const isSelected = isTile ? selectedTileType === cfg.key : selectedTowerType === cfg.key;
        if(isSelected){
          selectedTowerType = null;
          selectedTileType = null;
          clearPreview();
        } else {
          selectedTowerType = isTile ? null : cfg.key;
          selectedTileType = isTile ? cfg.key : null;
          deselectTower();
          clearPreview();
        }
        refreshNodeCards();
      });
      nodeCardsEl.appendChild(card);
    });
  }

        <div class="node-desc">${reward.description}</div>
        <div class="reward-stats"><span>${reward.type === 'tile' ? 'UTILITY TILE' : `DMG ${reward.damage}`}</span><span>${reward.type === 'tile' ? 'CONSUMABLE' : `RNG ${reward.range}`}</span></div>
      `;
      card.addEventListener('click', ()=> selectReward(reward));
      rewardCardsEl.appendChild(card);
    });
  }

  function presentWaveReward(){
    awaitingReward = true;
    currentRewards = drawRewards(rewardPool, 3);
    buildRewardCards();
    rewardOverlay.classList.remove('hidden');
    refreshWaveButton();
  }

  function selectReward(reward){
    addRewardToInventory(inventory, reward);
    awaitingReward = false;
    currentRewards = [];
    rewardCardsEl.innerHTML = '';
    rewardOverlay.classList.add('hidden');
    refreshNodeCards();
    if(wave >= MAX_WAVE) triggerWin();
    else {
      refreshWaveButton();
      showMessage(`${reward.name.toUpperCase()} ADDED TO INVENTORY`);
    }
  }

  const selName = document.getElementById('selName');
  const selDmg = document.getElementById('selDmg');
  const selRange = document.getElementById('selRange');
  const selRate = document.getElementById('selRate');
  const selKills = document.getElementById('selKills');
  const purgeBtn = document.getElementById('purgeBtn');

  function selectTower(tower){
    deselectTower();
    selectedTower = tower;
    selectedTowerType = null;
    selectedTileType = null;
    clearPreview();
    refreshNodeCards();
    const ring = makeRangeRing(tower.range, tower.cfg.color);
    ring.position.x = tower.group.position.x;
    ring.position.y = WALL_TOP + 0.02;
    ring.position.z = tower.group.position.z;
    scene.add(ring);
    tower.rangeRing = ring;
    refreshSelectedTowerUI();
    selectedPanel.classList.remove('hidden');
  }
  function refreshSelectedTowerUI(){
    if(!selectedTower) return;
    selName.textContent = selectedTower.cfg.name.toUpperCase();
    selDmg.textContent = selectedTower.damage.toFixed(1).replace('.0', '');
    selRange.textContent = selectedTower.range.toFixed(1);
    selRate.textContent = selectedTower.fireRate.toFixed(2)+'/s';
    selKills.textContent = selectedTower.kills;
    Object.keys(UPGRADE_STATS).forEach((stat)=>{
      const cost = getUpgradeCost(selectedTower, stat);
      const controls = upgradeButtons[stat];
      controls.cost.textContent = `⬡ ${cost}`;
      controls.button.disabled = gameOver || gold < cost;
    });
  }
  function deselectTower(){
    if(selectedTower && selectedTower.rangeRing){ scene.remove(selectedTower.rangeRing); selectedTower.rangeRing=null; }
    selectedTower = null;
    selectedPanel.classList.add('hidden');
  }
  Object.keys(UPGRADE_STATS).forEach((stat)=>{
    upgradeButtons[stat].button.addEventListener('click', ()=>{
      if(!selectedTower) return;
      const result = purchaseTowerUpgrade({tower: selectedTower, stat, gold});
      if(!result.ok){
        showMessage(result.reason === 'insufficient-gold' ? 'INSUFFICIENT GOLD' : 'INVALID UPGRADE');
        return;
      }
      gold = result.gold;
      selectedTower.upgrades = result.upgrades;
      selectedTower.damage = result.stats.damage;
      selectedTower.range = result.stats.range;
      selectedTower.fireRate = result.stats.fireRate;
      if(selectedTower.rangeRing){
        scene.remove(selectedTower.rangeRing);
        selectedTower.rangeRing = makeRangeRing(selectedTower.range, selectedTower.cfg.color);
        selectedTower.rangeRing.position.set(selectedTower.group.position.x, WALL_TOP + 0.02, selectedTower.group.position.z);
        scene.add(selectedTower.rangeRing);
      }
      updateGoldUI();
      showMessage(`${UPGRADE_STATS[stat].label} UPGRADED`);
    });
  });
  purgeBtn.addEventListener('click', ()=>{
    if(!selectedTower) return;
    const reward = rewardPool.find((item) => item.key === selectedTower.key);
    addRewardToInventory(inventory, {...reward, upgrades: {...selectedTower.upgrades}});
    removeTower(selectedTower);
    deselectTower();
    refreshNodeCards();
  });

  waveBtn.addEventListener('click', startWave);
  refreshWaveButton();

  document.getElementById('restartBtn').addEventListener('click', resetGame);

  /* ---------------------------------------------------------------------
     INPUT / RAYCASTING
  --------------------------------------------------------------------- */
  const raycaster = new THREE.Raycaster();
  const mouseNDC = new THREE.Vector2();
  let wallEditAction = null, lastEditedCellKey = null;

  function setMouseFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    mouseNDC.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouseNDC.y = -((e.clientY-rect.top)/rect.height)*2+1;
  }

  canvas.addEventListener('contextmenu', e=> e.preventDefault());

  function getCellAtPointer(e){
    setMouseFromEvent(e);
    raycaster.setFromCamera(mouseNDC, camera);
    const cellHits = raycaster.intersectObjects(cellMeshList);
    return cellHits.length ? cellHits[0].object.userData : null;
  }

  function editWallCell(gx, gy, action){
    const key = cellKey(gx, gy);
    if(key === lastEditedCellKey) return;
    lastEditedCellKey = key;
    const wallOptions = {gx, gy, walls: wallSet, occupied: occupiedSet, gridW: GRID_W, gridH: GRID_H, start: startCell, end: endCell};
    if(action === 'remove'){
      if(!wallSet.has(key)) return;
      const removal = canRemoveWall(wallOptions);
      if(removal.ok) removeWall(gx, gy);
      return;
    }
    if(wallSet.has(key)) return;
    const placement = canPlaceWall(wallOptions);
    if(placement.ok) placeWall(gx, gy);
  }

  canvas.addEventListener('pointerdown', (e)=>{
    if(e.button === 2){
      if(!gameOver){
        wallEditAction = 'remove';
        lastEditedCellKey = null;
        const cell = getCellAtPointer(e);
        if(cell) editWallCell(cell.gx, cell.gy, wallEditAction);
      }
      return;
    }
    if(e.button !== 0 || gameOver) return;
    setMouseFromEvent(e);
    raycaster.setFromCamera(mouseNDC, camera);

    const towerHits = raycaster.intersectObjects(towersGroup.children, true);
    if(towerHits.length){
      let obj = towerHits[0].object;
      while(obj && !obj.userData.towerRef) obj = obj.parent;
      if(obj && obj.userData.towerRef){ selectTower(obj.userData.towerRef); return; }
    }

    if(selectedTowerType || selectedTileType){
      const cellHits = raycaster.intersectObjects(cellMeshList);
      if(cellHits.length){
        const {gx, gy} = cellHits[0].object.userData;
        const key = gx+','+gy;
        const towerOnCell = towers.find(tower => cellKey(tower.gx, tower.gy) === key);
        if(towerOnCell){
          selectTower(towerOnCell);
          return;
        }
        const isTile = Boolean(selectedTileType);
        const typeKey = isTile ? selectedTileType : selectedTowerType;
        const cfg = isTile ? SPECIAL_TILE_TYPES[typeKey] : TOWER_TYPES[typeKey];
        const placement = isTile
          ? canPlaceTile({gx, gy, gridW: GRID_W, gridH: GRID_H, occupied: occupiedSet, tiles, inventory, typeKey})
          : canPlaceTower({gx, gy, isWall: wallSet.has(key), occupied: occupiedSet, inventory, typeKey});
        if(!placement.ok){
          const messages = {wall:'DEPLOY A WALL FIRST', occupied:'NODE SLOT OCCUPIED', 'tower-on-cell':'NODE SLOT OCCUPIED', unavailable:'NO ITEM IN INVENTORY', 'tile-exists':'CELL ALREADY HAS A TILE'};
          showMessage(messages[placement.reason] || 'INVALID NODE DEPLOYMENT');
          return;
        }
        if(isTile) placeTile(gx, gy, typeKey);
        else {
          const inventoryItem = inventory.find((item) => item.type === 'tower' && item.key === selectedTowerType);
          placeTower(gx, gy, selectedTowerType, inventoryItem);
        }
        if(isTile) removeFromInventory(inventory, 'tile', typeKey);
        else removeInventoryItem(inventory, inventory.find((item) => item.type === 'tower' && item.key === typeKey));
        selectedTowerType = null;
        selectedTileType = null;
        clearPreview();
        refreshNodeCards();
        return;
      }
    } else {
      wallEditAction = 'place';
      lastEditedCellKey = null;
      const cellHits = raycaster.intersectObjects(cellMeshList);
      if(cellHits.length){
        const {gx, gy} = cellHits[0].object.userData;
        const key = cellKey(gx, gy);
        const towerOnCell = towers.find(tower => cellKey(tower.gx, tower.gy) === key);
        if(towerOnCell){
          selectTower(towerOnCell);
          return;
        }
        editWallCell(gx, gy, 'place');
        return;
      }
      deselectTower();
    }
  });

  window.addEventListener('pointermove', (e)=>{
    if(wallEditAction){
      const cell = getCellAtPointer(e);
      if(cell) editWallCell(cell.gx, cell.gy, wallEditAction);
      return;
    }
    if(!selectedTowerType && !selectedTileType) return;
    setMouseFromEvent(e);
    raycaster.setFromCamera(mouseNDC, camera);
    const cellHits = raycaster.intersectObjects(cellMeshList);
    if(!cellHits.length){
      clearPreview();
      return;
    }
    if(cellHits.length){
      const {gx, gy} = cellHits[0].object.userData;
      const key = gx+','+gy;
      if(key !== hoveredCellKey){
        hoveredCellKey = key;
        const isTile = Boolean(selectedTileType);
        const typeKey = isTile ? selectedTileType : selectedTowerType;
        const cfg = isTile ? SPECIAL_TILE_TYPES[typeKey] : TOWER_TYPES[typeKey];
        const valid = isTile
          ? canPlaceTile({gx, gy, gridW: GRID_W, gridH: GRID_H, occupied: occupiedSet, tiles, inventory, typeKey}).ok
          : wallSet.has(key) && !occupiedSet.has(key);
        const p = gridToWorld(gx,gy);
        if(isTile) ensureTilePreview(typeKey);
        else ensurePreview(cfg);
        previewMesh.position.set(p.x, isTile ? 0 : WALL_TOP, p.z);
        if(previewRing) previewRing.position.set(p.x,WALL_TOP + 0.02,p.z);
        previewMesh.traverse(o=>{ if(o.material) o.material.opacity = valid?0.6:0.25; });
        if(previewRing) previewRing.material.color.set(valid ? cfg.color : 0xff3b5c);
      }
    }
  });
  window.addEventListener('pointerup', ()=>{
    wallEditAction = null;
    lastEditedCellKey = null;
  });

  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    camDistance = Math.min(40, Math.max(10, camDistance + e.deltaY*0.02));
  }, {passive:false});

  window.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      selectedTowerType = null;
      selectedTileType = null;
      clearPreview();
      deselectTower();
      refreshNodeCards();
    }
  });

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ---------------------------------------------------------------------
     GAME OVER / WIN / RESET
  --------------------------------------------------------------------- */
  function triggerLoss(){
    gameOver = true;
    overlayTitle.textContent = 'CORE BREACHED';
    overlayTitle.style.color = 'var(--danger)';
    overlaySubtitle.textContent = `The intrusion overwhelmed your defenses at wave ${wave}. Deploy again to re-secure the sector.`;
    overlay.classList.remove('hidden');
  }
  function triggerWin(){
    gameOver = true;
    overlayTitle.textContent = 'SECTOR SECURED';
    overlayTitle.style.color = 'var(--cyan)';
    overlaySubtitle.textContent = `All ${MAX_WAVE} intrusion waves neutralized. Core integrity held at ${Math.max(0,Math.floor(lives))}.`;
    overlay.classList.remove('hidden');
  }

  function resetGame(){
    towers.slice().forEach(removeTower);
    enemies.slice().forEach(removeEnemy);
    projectiles.forEach(p=>projGroup.remove(p.mesh));
    projectiles = [];
    effects.forEach(fx=>scene.remove(fx.mesh));
    effects = [];
    Object.values(wallMeshMap).forEach(mesh => wallGroup.remove(mesh));
    wallSet.clear();
    Object.keys(wallMeshMap).forEach(key => delete wallMeshMap[key]);
    refreshRoute();
    tiles = INITIAL_TILES.map((tile) => ({...tile}));
    renderAllTiles();
    gold = 150; lives = 20; wave = 0; waveInProgress = false; gameOver = false; awaitingReward = false;
    spawnQueue = []; spawnTimer = 0;
    inventory = rewardPool.filter((reward) => reward.type === 'tower').map((reward) => ({...reward}));
    currentRewards = [];
    selectedTowerType = null; selectedTileType = null; clearPreview(); deselectTower();
    updateGoldUI(); updateLivesUI(); updateWaveUI(); refreshWaveButton(); refreshNodeCards();
    rewardCardsEl.innerHTML = '';
    rewardOverlay.classList.add('hidden');
    overlay.classList.add('hidden');
  }

  // Lightweight inspection surface for browser tests and deployment
  // diagnostics. It exposes state only; gameplay still goes through the
  // same input handlers and rules as a normal player session.
  window.__CORE_DEFENSE__ = {
    getSceneState(){
      return {
        renderStatus: canvas.dataset.renderStatus || 'unknown',
        renderCalls: renderer.info.render.calls,
        gold: Math.floor(gold),
        mapCells: cellMeshList.length,
        walls: wallSet.size,
        routeCells: pathSetRoute.length,
        routeVersion,
        enemyRouteVersions: enemies.map(enemy => enemy.routeVersion),
        enemyPositions: enemies.map(enemy => [enemy.mesh.position.x, enemy.mesh.position.z]),
        enemyRouteStarts: enemies.map(enemy => [enemy.route[0].x, enemy.route[0].z]),
        towers: towers.length,
        tiles: tiles.map((tile) => ({...tile})),
        tileInventory: inventory.filter((item) => item.type === 'tile').map((item) => item.key),
        enemyEffects: enemies.map((enemy) => ({activeTile: enemy.activeTile, speedMultiplier: enemy.activeTileEffect.speedMultiplier, dotDamage: enemy.activeTileEffect.dotDamage, dotTimer: enemy.dotTimer})),
        towerStats: towers.map((tower) => ({key: tower.key, gx: tower.gx, gy: tower.gy, damage: tower.damage, range: tower.range, fireRate: tower.fireRate, activeTile: tower.activeTile})),
        towerUpgrades: towers.map((tower) => ({...tower.upgrades})),
        previewVisible: Boolean(previewMesh),
        enemies: enemies.length,
        inventory: inventory.map((item) => item.key),
        inventoryItems: inventory.map((item) => ({type: item.type, key: item.key})),
        awaitingReward,
        rewardChoices: currentRewards.map((reward) => reward.key)
      };
    },
    showWaveRewardForTest(){
      presentWaveReward();
    },
    grantRewardForTest(type, key){
      const reward = rewardPool.find((item) => item.type === type && item.key === key);
      if(reward) addRewardToInventory(inventory, reward);
      refreshNodeCards();
    },
    resetGameForTest(){
      resetGame();
    },
    projectCell(gx, gy){
      const p = gridToWorld(gx, gy).setY(0);
      p.project(camera);
      const rect = canvas.getBoundingClientRect();
      return {
        x: rect.left + (p.x + 1) * rect.width / 2,
        y: rect.top + (-p.y + 1) * rect.height / 2
      };
    }
  };

  /* ---------------------------------------------------------------------
     MAIN LOOP
  --------------------------------------------------------------------- */
  const clock = new THREE.Clock();
  let elapsed = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    if(!gameOver){
      if(waveInProgress) updateSpawning(dt);
      updateEnemies(dt, elapsed);
      updateTowers(dt);
      updateProjectiles(dt);
    }
    updateEffects(dt);
    updatePulses(dt, elapsed);
    coreGroup.rotation.y += dt*0.5;
    coreMesh.scale.setScalar(1 + Math.sin(elapsed*2.4)*0.06);
    portal.rotation.z += dt*0.8;
    updateCamera();
    renderer.render(scene, camera);
  }

  updateGoldUI(); updateLivesUI(); updateWaveUI();
  animate();
})();
</script>
</body>
</html>
